name: Kernel Patch CI Test

on:
  # Triggered by API call from Argus Pipeline
  repository_dispatch:
    types: [test-patch]
  
  # Manual trigger for testing
  workflow_dispatch:
    inputs:
      patch_content:
        description: 'Patch content (base64 encoded)'
        required: false
        type: string
      kernel_ref:
        description: 'Kernel git ref (default: master)'
        required: false
        default: 'master'
        type: string

jobs:
  checkpatch:
    name: checkpatch.pl
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Linux kernel source
        uses: actions/checkout@v4
        with:
          repository: torvalds/linux
          ref: ${{ inputs.kernel_ref || 'master' }}
          fetch-depth: 1
          path: linux

      - name: Decode and save patch
        env:
          PATCH_CONTENT: ${{ github.event.client_payload.patch_content || inputs.patch_content }}
        run: |
          if [ -n "$PATCH_CONTENT" ]; then
            echo "$PATCH_CONTENT" | base64 -d > /tmp/test_patch.diff
            sed -i 's/\r$//' /tmp/test_patch.diff
            echo "✅ Patch decoded ($(wc -l < /tmp/test_patch.diff) lines)"
          else
            echo "❌ No patch content provided"
            exit 1
          fi

      - name: Run checkpatch.pl
        run: |
          echo "🔍 Running checkpatch.pl..."
          cd linux
          perl scripts/checkpatch.pl --no-tree --terse /tmp/test_patch.diff 2>&1 | tee /tmp/checkpatch_output.txt
          CHECKPATCH_EXIT=${PIPESTATUS[1]}
          
          # Parse results
          ERRORS=$(grep -c "^ERROR:" /tmp/checkpatch_output.txt 2>/dev/null || echo 0)
          WARNINGS=$(grep -c "^WARNING:" /tmp/checkpatch_output.txt 2>/dev/null || echo 0)
          
          echo ""
          echo "=== checkpatch.pl Summary ==="
          echo "Errors: $ERRORS"
          echo "Warnings: $WARNINGS"
          echo "Exit code: $CHECKPATCH_EXIT"
          
          # Save results
          echo "$ERRORS" > /tmp/checkpatch_errors.txt
          echo "$WARNINGS" > /tmp/checkpatch_warnings.txt
          echo "$CHECKPATCH_EXIT" > /tmp/checkpatch_exit_code.txt
          
          # Show full output
          if [ -s /tmp/checkpatch_output.txt ]; then
            echo ""
            echo "=== Full checkpatch output ==="
            cat /tmp/checkpatch_output.txt
          fi

      - name: Upload checkpatch results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkpatch-results
          path: |
            /tmp/checkpatch_output.txt
            /tmp/checkpatch_errors.txt
            /tmp/checkpatch_warnings.txt
            /tmp/checkpatch_exit_code.txt
          retention-days: 7

  test-matrix:
    name: ${{ matrix.config.name }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.config.timeout }}
    
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: x86_64_defconfig
            arch: x86_64
            defconfig: defconfig
            cross_compile: ""
            timeout: 20
          
          - name: tinyconfig
            arch: x86_64
            defconfig: tinyconfig
            cross_compile: ""
            timeout: 15
          
          - name: x86_64_allmodconfig
            arch: x86_64
            defconfig: allmodconfig
            cross_compile: ""
            timeout: 30
          
          - name: arm64_defconfig
            arch: arm64
            defconfig: defconfig
            cross_compile: "aarch64-linux-gnu-"
            timeout: 35
    
    steps:
      - name: Checkout Argus workflow repository
        uses: actions/checkout@v4
        with:
          repository: cenimenma/draft_5
          ref: master
          fetch-depth: 1
          path: argus-workflow
      
      - name: Checkout Linux kernel source
        uses: actions/checkout@v4
        with:
          repository: torvalds/linux
          ref: ${{ inputs.kernel_ref || 'master' }}
          fetch-depth: 1
          path: linux
      
      - name: Decode and save patch
        env:
          PATCH_CONTENT: ${{ github.event.client_payload.patch_content || inputs.patch_content }}
        run: |
          if [ -n "$PATCH_CONTENT" ]; then
            echo "$PATCH_CONTENT" | base64 -d > /tmp/test_patch.diff
            sed -i 's/\r$//' /tmp/test_patch.diff
            echo "✅ Patch decoded ($(wc -l < /tmp/test_patch.diff) lines)"
            
            echo "Files modified:"
            grep -E "^\+\+\+ b/" /tmp/test_patch.diff || echo "  (none found)"
          else
            echo "❌ No patch content provided"
            exit 1
          fi
      
      - name: Copy workflow files to Linux source
        run: |
          cp -r argus-workflow/.github/workflows/* linux/.github/workflows/ 2>/dev/null || true
      
      - name: Apply patch to kernel source
        working-directory: ./linux
        run: |
          echo "📦 Applying patch..."
          if git apply --check /tmp/test_patch.diff 2>/tmp/patch_error.log; then
            git apply /tmp/test_patch.diff
            echo "✅ Patch applied successfully"
            echo "0" > /tmp/patch_exit_code
          else
            echo "❌ Patch application failed"
            echo "1" > /tmp/patch_exit_code
            
            PATCH_ERROR=$(cat /tmp/patch_error.log 2>/dev/null || echo "Unknown error")
            
            echo "=== PATCH APPLICATION FAILED ===" > /tmp/build.log
            echo "Patch file: /tmp/test_patch.diff" >> /tmp/build.log
            echo "Error log:" >> /tmp/build.log
            cat /tmp/patch_error.log >> /tmp/build.log 2>/dev/null || true
            echo "" >> /tmp/build.log
            echo "First 30 lines of patch:" >> /tmp/build.log
            head -30 /tmp/test_patch.diff >> /tmp/build.log
            
            echo "=== ERRORS ===" > /tmp/errors.txt
            echo "[ERROR] Patch application failed" >> /tmp/errors.txt
            if [ -s /tmp/patch_error.log ]; then
              grep -i "error\|fatal\|corrupt" /tmp/patch_error.log | head -10 >> /tmp/errors.txt || true
            fi
            
            touch /tmp/warnings.txt
            echo "1" > /tmp/build_exit_code
          fi
      
      - name: Setup build environment
        run: |
          echo "🔧 Installing build dependencies..."
          sudo apt-get update
          sudo apt-get install -y \
            gcc \
            make \
            flex \
            bison \
            libssl-dev \
            libelf-dev \
            bc \
            ${{ matrix.config.cross_compile != '' && 'gcc-aarch64-linux-gnu' || '' }}
      
      - name: Cache kernel build artifacts
        uses: actions/cache@v4
        with:
          path: |
            linux/.cache
            linux/usr/include
            linux/scripts/kconfig
          key: ${{ runner.os }}-kernel-${{ matrix.config.name }}-${{ hashFiles('linux/Makefile') }}
          restore-keys: |
            ${{ runner.os }}-kernel-${{ matrix.config.name }}-
            ${{ runner.os }}-kernel-
      
      - name: Configure kernel (${{ matrix.config.name }})
        working-directory: ./linux
        run: |
          echo "⚙️  Configuring kernel for ${{ matrix.config.name }}..."
          make ARCH=${{ matrix.config.arch }} CROSS_COMPILE=${{ matrix.config.cross_compile }} ${{ matrix.config.defconfig }}
      
      - name: Build kernel (${{ matrix.config.name }})
        working-directory: ./linux
        if: success() || (failure() && hashFiles('/tmp/patch_exit_code') != '')
        run: |
          PATCH_EXIT_CODE=$(cat /tmp/patch_exit_code 2>/dev/null || echo "0")
          if [ "$PATCH_EXIT_CODE" -eq "1" ]; then
            echo "⏭️  Skipping compilation - patch did not apply"
            echo "1" > /tmp/build_exit_code
            exit 0
          fi
          
          echo "🔨 Building kernel for ${{ matrix.config.name }}..."
          echo "Using $(nproc) CPU cores"
          
          set +e
          make ARCH=${{ matrix.config.arch }} CROSS_COMPILE=${{ matrix.config.cross_compile }} W=1 -j$(nproc) 2>&1 | tee /tmp/build.log
          BUILD_EXIT_CODE=$?
          set -e
          
          echo $BUILD_EXIT_CODE > /tmp/build_exit_code
          
          if [ $BUILD_EXIT_CODE -eq 0 ]; then
            echo "✅ Compilation successful!"
          else
            echo "❌ Compilation failed with exit code $BUILD_EXIT_CODE"
          fi
      
      - name: Extract errors and warnings
        if: always()
        run: |
          if [ -f /tmp/build.log ]; then
            grep -i "error:" /tmp/build.log | head -20 > /tmp/errors.txt || true
            grep -i "warning:" /tmp/build.log | head -50 > /tmp/warnings.txt || true
            
            ERROR_COUNT=$(wc -l < /tmp/errors.txt)
            WARNING_COUNT=$(wc -l < /tmp/warnings.txt)
            
            echo "Found $ERROR_COUNT errors and $WARNING_COUNT warnings"
            
            if [ $ERROR_COUNT -gt 0 ]; then
              echo "=== ERRORS ==="
              cat /tmp/errors.txt
            fi
            if [ $WARNING_COUNT -gt 0 ]; then
              echo "=== WARNINGS ==="
              cat /tmp/warnings.txt
            fi
          else
            echo "⚠️  Build log not found"
          fi
      
      - name: Upload build logs as artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ matrix.config.name }}
          path: |
            /tmp/build.log
            /tmp/errors.txt
            /tmp/warnings.txt
            /tmp/build_exit_code
          retention-days: 7
      
      - name: Check final result
        run: |
          BUILD_EXIT_CODE=$(cat /tmp/build_exit_code 2>/dev/null || echo "1")
          if [ "$BUILD_EXIT_CODE" -eq "0" ]; then
            echo "✅ FINAL RESULT: PASS"
            exit 0
          else
            echo "❌ FINAL RESULT: FAIL"
            exit 1
          fi
